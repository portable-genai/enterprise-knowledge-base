[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-base"
version = "0.0.1"
description = "A2 Enterprise Knowledge Base — ACL-aware governed RAG (search, grounded answer, ingest) over the bank corpus, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["rag", "knowledge-base", "acl", "governed-rag", "gemini", "adk", "gcp", "bfsi", "residency"]

# Core deps are framework-light so the domain + on-prem/test profile install without
# any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repo, so CI
  # installs it with zero credentials. hex-service-kit: inbound S2S verification (web), outbound
  # S2S headers, fail-closed net defaults, StrEnum base, to_jsonable, hash-chained WORM audit.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.4",
  # Shared jurisdiction PII pack, pinned by tag. One pattern source for the runtime
  # redactor (local regex + the GCP DLP custom info types) and the eval pii_safety
  # metric, so a non-home-jurisdiction fork cannot inherit a falsely green gate (C4/E2).
  # Pure stdlib, zero runtime dependencies, installs on an air-gapped host.
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.7.1",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-storage>=2.18",
  "google-cloud-dlp>=3.20",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "google-cloud-alloydb-connector[pg8000]>=1.4",
  "sqlalchemy>=2.0",
  "a2a-sdk[http-server]>=1.1",
  "mcp>=2.1",
]
dev = [
  # Shared commons: the --mode smoke|gate scaffold + report rendering used by
  # eval/run_eval.py. Dev-only: the serving core never imports it.
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
enterprise-knowledge-base = "enterprise_kb.cli.main:app"

# Required for the hex-service-kit / agent-eval-kit git+https pins (direct references).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_kb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there hurts
# more than it helps. The shipped package, tests and selected automation scripts remain
# CI-gated.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
