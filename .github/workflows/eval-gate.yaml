name: Eval gate

# The A4 / P-08 promotion gate. Runs eval/run_eval.py over the golden dataset and fails
# (non-zero exit) if any metric : retrieval recall, ACL correctness, citation accuracy,
# safety : is below threshold. A release must NOT be promoted to Agent Runtime unless this
# job is green. ACL correctness (>= 0.99) is the non-negotiable bar for a governed store.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically on the local profile by default (SDK-free), so
  # the gate itself needs no cloud credentials. Switch to gcp in a protected environment to
  # score against the live Gen AI evaluation service.
  KB_PROFILE: local

jobs:
  eval:
    name: Gen AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
