name: Build managed images

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Auditable immutable release identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-image-build
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: enterprise-knowledge-base
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate artifact publisher with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.ARTIFACT_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Configure regional registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push all reviewed workloads
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"
          docker build --pull=false -f Dockerfile -t "${registry}/api:${RELEASE_ID}" .
          docker build --pull=false -f ui/Dockerfile -t "${registry}/ui:${RELEASE_ID}" ui
          docker build --pull=false -f src/enterprise_kb/pipelines/Dockerfile -t "${registry}/refresh:${RELEASE_ID}" .
          for image in api ui refresh; do
            docker push "${registry}/${image}:${RELEASE_ID}"
          done
      - name: Emit immutable Terraform inputs
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"
          for image in api ui refresh; do
            digest=$(gcloud artifacts docker images describe "${registry}/${image}:${RELEASE_ID}" --format='value(image_summary.digest)')
            case "${image}" in
              api) variable=app_image ;;
              ui) variable=ui_image ;;
              refresh) variable=refresh_job_image ;;
            esac
            printf '%s = "%s/%s@%s"\n' "${variable}" "${registry}" "${image}" "${digest}"
          done | tee managed-image-digests.tfvars
      - name: Retain non-secret digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-image-digests-${{ inputs.release_id }}
          path: managed-image-digests.tfvars
          retention-days: 90
