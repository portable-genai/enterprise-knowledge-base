name: Managed demo release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Auditable lowercase release identifier used only as a temporary image tag
        required: true
        type: string
      demo_user_email:
        description: Exact reviewed IAP user receiving the fictional demo ACL binding
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: enterprise-knowledge-base-managed-release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPOSITORY: enterprise-knowledge-base
  TF_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
  TF_STATE_PREFIX: hrz2/${{ vars.GCP_PROJECT_ID }}

jobs:
  # Phase 1 has its own reviewed environment. A targeted apply creates only API enablement,
  # regional KMS, the CMEK repository and its scoped publisher grant. It cannot deploy an app.
  bootstrap:
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Authenticate the deployment identity with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Refuse an ungoverned or non-Singapore state backend
        run: |
          set -euo pipefail
          describe() {
            gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --format="value($1)"
          }
          [[ "$(describe location | tr '[:upper:]' '[:lower:]')" == "$REGION" ]]
          [[ "$(describe versioning.enabled | tr '[:upper:]' '[:lower:]')" == "true" ]]
          [[ "$(describe iamConfiguration.uniformBucketLevelAccess.enabled | tr '[:upper:]' '[:lower:]')" == "true" ]]
          [[ "$(describe iamConfiguration.publicAccessPrevention | tr '[:upper:]' '[:lower:]')" == "enforced" ]]
          [[ -n "$(describe encryption.defaultKmsKeyName)" ]]
      - name: Load reviewed non-secret deployment inputs
        env:
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          ARTIFACT_PUBLISHER: ${{ vars.ARTIFACT_PUBLISHER_SERVICE_ACCOUNT }}
          CONTROL_PUBLISHER: ${{ vars.CONTROL_PUBLISHER_SERVICE_ACCOUNT }}
          SOURCE_PUBLISHER: ${{ vars.SOURCE_PUBLISHER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null infra/terraform/terraform.auto.tfvars.json
          printf '%s' "$TERRAFORM_TFVARS_JSON" > infra/terraform/terraform.auto.tfvars.json
          jq -e 'type == "object"' infra/terraform/terraform.auto.tfvars.json >/dev/null
          jq -e --arg artifact "$ARTIFACT_PUBLISHER" \
            --arg control "$CONTROL_PUBLISHER" --arg source "$SOURCE_PUBLISHER" \
            '.artifact_publisher_service_account_email == $artifact and
             .control_publisher_service_account_email == $control and
             .source_publisher_service_account_email == $source' \
            infra/terraform/terraform.auto.tfvars.json >/dev/null
      - name: Bootstrap APIs, regional CMEK and the image repository only
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          terraform -chdir=infra/terraform apply -auto-approve \
            -var=bootstrap_only=true \
            -target=google_artifact_registry_repository.images \
            -target=google_artifact_registry_repository_iam_member.publisher

  build:
    needs: bootstrap
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Authenticate the repository-scoped publisher with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.ARTIFACT_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v2
      - name: Build and publish immutable workload images
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || {
            echo "release_id must be a lowercase Docker-safe identifier" >&2
            exit 2
          }
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --pull=false -f Dockerfile -t "${registry}/api:${RELEASE_ID}" .
          docker build --pull=false -f ui/Dockerfile -t "${registry}/ui:${RELEASE_ID}" ui
          docker build --pull=false -f src/enterprise_kb/pipelines/Dockerfile \
            -t "${registry}/refresh:${RELEASE_ID}" .
          for image in api ui refresh; do
            docker push "${registry}/${image}:${RELEASE_ID}"
          done
          for image in api ui refresh; do
            digest=$(gcloud artifacts docker images describe \
              "${registry}/${image}:${RELEASE_ID}" --format='value(image_summary.digest)')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 3
            case "$image" in
              api) variable=app_image ;;
              ui) variable=ui_image ;;
              refresh) variable=refresh_job_image ;;
            esac
            printf '%s = "%s/%s@%s"\n' "$variable" "$registry" "$image" "$digest"
          done > managed-image-digests.tfvars
      - name: Retain immutable digest evidence for phase 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-image-digests-${{ inputs.release_id }}
          path: managed-image-digests.tfvars
          retention-days: 90

  # Phase 2 begins only after the protected managed-release environment is approved. The full
  # plan consumes digests emitted above; mutable tags never reach Cloud Run or Terraform state.
  apply:
    needs: build
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Authenticate the deployment identity with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Download phase-1 image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-image-digests-${{ inputs.release_id }}
      - name: Load reviewed non-secret deployment inputs
        env:
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          DEMO_IAP_MEMBER: user:${{ inputs.demo_user_email }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null infra/terraform/terraform.auto.tfvars.json
          printf '%s' "$TERRAFORM_TFVARS_JSON" > infra/terraform/terraform.auto.tfvars.json
          jq -e 'type == "object"' infra/terraform/terraform.auto.tfvars.json >/dev/null
          jq -e --arg member "$DEMO_IAP_MEMBER" '.iap_accessors | index($member) != null' \
            infra/terraform/terraform.auto.tfvars.json >/dev/null
      - name: Apply the reviewed Singapore stack
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          backend_id=$(terraform -chdir=infra/terraform output -raw \
            managed_api_backend_service_id 2>/dev/null || true)
          [[ "$backend_id" =~ ^[0-9]+$ ]] || backend_id=bootstrap-pending
          terraform -chdir=infra/terraform apply -auto-approve \
            -var=bootstrap_only=false \
            -var="iap_backend_service_id=${backend_id}" \
            -var-file="${GITHUB_WORKSPACE}/managed-image-digests.tfvars"
          # A fresh project could not know the backend id until the regional backend existed.
          # The first revision is deliberately fail-closed (`bootstrap-pending` rejects every
          # real IAP assertion); this mandatory second apply converges the exact audience before
          # schema, corpus publication or browser verification can run.
          backend_id=$(terraform -chdir=infra/terraform output -raw \
            managed_api_backend_service_id)
          [[ "$backend_id" =~ ^[0-9]+$ ]] || exit 4
          terraform -chdir=infra/terraform apply -auto-approve \
            -var=bootstrap_only=false \
            -var="iap_backend_service_id=${backend_id}" \
            -var-file="${GITHUB_WORKSPACE}/managed-image-digests.tfvars"
          terraform -chdir=infra/terraform output -raw managed_api_iap_audience \
            | grep -Fx "/projects/$(gcloud projects describe "$PROJECT_ID" \
                --format='value(projectNumber)')/global/backendServices/${backend_id}"

  migrate:
    needs: apply
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Authenticate the passwordless migration identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.MIGRATION_SERVICE_ACCOUNT }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Load state and run the audited 000 then 001 migrations
        env:
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null infra/terraform/terraform.auto.tfvars.json
          printf '%s' "$TERRAFORM_TFVARS_JSON" > infra/terraform/terraform.auto.tfvars.json
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          users=$(terraform -chdir=infra/terraform output -json alloydb_iam_database_users)
          export KB_ALLOYDB_URI
          export KB_MIGRATION_IAM_DB_USER
          export KB_APP_IAM_DB_USER
          export KB_PIPELINE_IAM_DB_USER
          export KB_SCHEMA_EVIDENCE_DIR="${GITHUB_WORKSPACE}/evidence/schema-${GITHUB_RUN_ID}"
          KB_ALLOYDB_URI=$(terraform -chdir=infra/terraform output -raw alloydb_instance_uri)
          KB_MIGRATION_IAM_DB_USER=$(jq -er .migration <<<"$users")
          KB_APP_IAM_DB_USER=$(jq -er .app <<<"$users")
          KB_PIPELINE_IAM_DB_USER=$(jq -er .pipeline <<<"$users")
          scripts/apply_managed_schema.sh
      - name: Retain non-secret migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-schema-evidence-${{ inputs.release_id }}
          path: evidence/
          retention-days: 90

  publish_and_refresh:
    needs: migrate
    runs-on: [self-hosted, linux, hrz2-vpc]
    environment: managed-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Authenticate the deployment identity to read reviewed outputs
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Resolve the exact managed artifact locations
        env:
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null infra/terraform/terraform.auto.tfvars.json
          printf '%s' "$TERRAFORM_TFVARS_JSON" > infra/terraform/terraform.auto.tfvars.json
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          {
            echo "RAW_SOURCE_BUCKET=$(terraform -chdir=infra/terraform output -raw raw_source_bucket)"
            echo "CORPUS_REGISTRY_URI=$(terraform -chdir=infra/terraform output -raw corpus_registry_uri)"
            echo "ACL_BINDINGS_URI=$(terraform -chdir=infra/terraform output -raw acl_bindings_uri)"
            echo "REFRESH_JOB_NAME=$(terraform -chdir=infra/terraform output -raw refresh_job_name)"
            echo "MANAGED_API_URL=$(terraform -chdir=infra/terraform output -raw managed_api_url)"
          } >> "$GITHUB_ENV"
      - name: Render the reviewed fictional corpus and ACL authority
        env:
          DEMO_USER_EMAIL: ${{ inputs.demo_user_email }}
        run: |
          set -euo pipefail
          python3 scripts/render_managed_demo_artifacts.py \
            --raw-bucket "$RAW_SOURCE_BUCKET" \
            --user-email "$DEMO_USER_EMAIL" \
            --output-dir rendered-managed-demo
          sha256sum deploy/managed-demo/cloud-onboarding-policy.txt \
            rendered-managed-demo/registry.yaml rendered-managed-demo/bindings.json \
            > rendered-managed-demo/sha256.txt
      - name: Publish the raw source with the source-only identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SOURCE_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Upload the fictional raw source
        run: >-
          gcloud storage cp deploy/managed-demo/cloud-onboarding-policy.txt
          "gs://${RAW_SOURCE_BUCKET}/sources/cloud-onboarding-policy.txt"
      - name: Authenticate the control-authority publisher
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CONTROL_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Publish the exact reviewed registry and ACL objects
        run: |
          set -euo pipefail
          gcloud storage cp rendered-managed-demo/registry.yaml "$CORPUS_REGISTRY_URI"
          gcloud storage cp rendered-managed-demo/bindings.json "$ACL_BINDINGS_URI"
      - name: Re-authenticate the deployment identity for the initial refresh
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2ee3c9 # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Run and wait for the initial governed-corpus refresh
        run: >-
          gcloud run jobs execute "$REFRESH_JOB_NAME" --project "$PROJECT_ID"
          --region "$REGION" --wait
      - name: Retain artifact checksums and presenter handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-demo-artifacts-${{ inputs.release_id }}
          path: rendered-managed-demo/
          retention-days: 90
      - name: Write the human IAP verification step
        env:
          DEMO_USER_EMAIL: ${{ inputs.demo_user_email }}
        run: |
          {
            echo '## Managed browser verification'
            echo
            echo "Open ${MANAGED_API_URL} and authenticate through IAP as ${DEMO_USER_EMAIL}."
            echo 'Ask: What due diligence is required before onboarding a cloud provider?'
            echo 'Keep the UI ACL narrowing field empty: identity and tags come from the verified IAP principal plus the published ACL authority.'
          } >> "$GITHUB_STEP_SUMMARY"
