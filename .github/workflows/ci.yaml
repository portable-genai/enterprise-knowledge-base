name: CI

# Lint + type-check + tests on the LOCAL profile : a WORKING offline stack (SQLite FTS5
# + deterministic LLM) that needs NO Google Cloud credentials and NO google-cloud-*
# packages. Integration tests are deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KB_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK, locked)
        # Proves the domain + local profile install and run with no google-cloud-* deps.
        # Deps come from the committed lockfile so CI builds are reproducible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check src tests scripts/kb_demo.py scripts/demo_selftest.py scripts/demo_server_selftest.py scripts/portability_demo.py scripts/rename_fork.py

      - name: Ruff (format check)
        run: ruff format --check src tests scripts/kb_demo.py scripts/demo_selftest.py scripts/demo_server_selftest.py scripts/portability_demo.py scripts/rename_fork.py

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Demo anti-rot and bounded portability evidence
        run: |
          python scripts/demo_selftest.py
          python scripts/portability_demo.py

      - name: Smoke (end-to-end offline answer under the local profile)
        # Proves the local stack runs the whole pipeline and returns a real cited answer
        # offline (not a NotImplementedError), with no Google Cloud SDK installed.
        run: |
          enterprise-knowledge-base answer \
            "What due diligence is required before onboarding a cloud provider?" \
            --principals "user:jane@bank.test"

  terraform:
    name: terraform fmt + validate (no cloud credentials)
    runs-on: ubuntu-latest
    # Offline posture check for the residency/sovereignty stack (D5): `validate` needs the
    # provider plugins from the registry but NO Google Cloud credentials and no backend, so
    # a residency mistake (a region outside allowed_regions, an unparseable perimeter) is
    # caught in the pipeline rather than at apply time. `-backend=false` keeps state out of
    # it entirely. This job proves the CODE and CONFIG half of D5; live enforcement of the
    # Org Policy, the perimeter and CMEK still needs a named deployment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: terraform fmt (check only)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no credentials)
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform
        run: terraform validate -no-color

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    # Fails on known-vulnerable dependencies. Locked requirements files are audited so
    # the result matches exactly what CI and the container image install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          # --no-deps: the lockfiles are fully compiled (every transitive dep pinned), so
          # audit exactly those versions without re-resolving. Newer pip-audit requires it
          # (or a hashed file) alongside --disable-pip.
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # A plain hard gate, matching the Python side where pip-audit fails the job rather
      # than warning. There is no allowlist and no expiry: an advisory is either fixed in
      # the lockfile or taken as an exception in a reviewed commit. A step whose verdict
      # depends on the wall clock is green today and red tomorrow from an identical tree,
      # which is why tests/unit/test_workflow_expiry_guard.py forbids the shape.
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm run assert-hydratable
